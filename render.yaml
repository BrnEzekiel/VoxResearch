services:
  - type: web
    name: voxresearch-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: META_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://voxresearch.work.gd,https://www.voxresearch.work.gd
